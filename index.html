<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>早書き回答ツール</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--bg:#e9eef3;--ink:#13233a;--mut:#6a7a8f;--line:#c9d3de;--pan:#fff;--red:#e5484d;--redbg:#ffd8d9;--blue:#2f6fed;--bluebg:#d6e4ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif}
#app{height:100dvh;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--pan);border-radius:8px;padding:.55em 1em;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}button:disabled{opacity:.4;cursor:default}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:.6em .8em;background:#fff;min-height:44px}
.home{margin:auto;width:min(420px,92vw);display:flex;flex-direction:column;gap:14px}
.home h1{font-size:1.8rem;margin:0 0 4px;letter-spacing:.04em}
.panel{background:var(--pan);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}.panel h2{margin:0;font-size:1rem}
.err{color:var(--red);min-height:1.5em;margin:0}
header.top{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--ink);color:#fff;padding-top:max(10px,env(safe-area-inset-top))}
header.top .code{font-weight:700;letter-spacing:.15em;font-size:1.2rem}header.top .sp{flex:1}
header.top button{min-height:36px;padding:.2em .8em;background:transparent;color:#fff;border-color:#5b6f8a}
.pmain{flex:1;min-height:0;display:flex;flex-direction:column}
.left{flex:1;min-height:0;display:flex;flex-direction:column}
.side{order:-1;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;white-space:nowrap;background:#dde5ed}
.chip{background:#fff;border-radius:99px;padding:2px 12px;font-size:.9rem}
.info{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.info h3{margin:6px 0 0;font-size:.95rem;color:var(--mut)}.mut{color:var(--mut);margin:0}
.rv{background:#fff;border-left:5px solid var(--ink);border-radius:6px;padding:8px 12px}.rv b{display:block;font-size:.85rem;color:var(--mut)}
.mine{border-radius:8px;padding:8px 12px;background:#fff;border:2px solid var(--line)}
.mine.ok{background:var(--redbg);border-color:var(--red)}.mine.ng{background:var(--bluebg);border-color:var(--blue)}
.mine small{display:block;font-weight:700}
.ans{padding:10px 12px max(12px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.ans .row{display:flex;gap:8px;margin-top:8px;align-items:center}.ans .row span{flex:1;color:var(--mut);font-size:.9rem}
@media(min-width:900px){.pmain{flex-direction:row}.side{order:0;flex-direction:column;width:240px;overflow-y:auto;white-space:normal;padding:14px}.chip{border-radius:8px;padding:6px 12px}}
.grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);margin-top:12vh}
.card{background:#fff;border:3px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:150px;overflow:hidden}
.card.ok{background:var(--redbg);border-color:var(--red)}.card.ng{background:var(--bluebg);border-color:var(--blue)}
.card .h{display:flex;gap:6px;align-items:center;padding:6px 10px;font-size:.85rem;background:rgba(19,35,58,.06)}
.card .h b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .h label{display:flex;align-items:center;min-width:32px;min-height:32px;justify-content:center}
.card .t{flex:1;padding:8px 10px;font-size:1.15rem;font-weight:700;word-break:break-all}
.card .b{display:flex;gap:6px;padding:6px 8px}.card .b button{flex:1;font-size:1.3rem;font-weight:700}
.card.ok .b .o{background:var(--red);color:#fff;border-color:var(--red)}.card.ng .b .x{background:var(--blue);color:#fff;border-color:var(--blue)}
.pend{font-size:.75rem;color:var(--mut)}
footer.bar{display:flex;gap:8px;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
footer.bar button{flex:1}
dialog{border:0;border-radius:12px;padding:18px;width:min(440px,92vw)}dialog::backdrop{background:rgba(19,35,58,.5)}
dialog .f{display:flex;gap:10px;align-items:center;margin:12px 0}dialog h2{margin:0 0 6px;font-size:1.1rem}
dialog input[type=number]{width:5em;padding:.4em;border:1px solid var(--line);border-radius:6px}
dialog input[type=checkbox]{width:22px;height:22px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}.tools button{min-height:40px;padding:.2em .7em;font-size:.9rem}.tools button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#cv{display:block;margin:0 auto;max-width:100%;max-height:32dvh;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair}
.info img{display:block;max-width:min(100%,320px);border:1px solid var(--line);background:#fff;border-radius:6px;margin:4px 0}
.card .t img{display:block;width:100%;background:#fff;border-radius:4px;cursor:zoom-in}
select{font:inherit;padding:.4em;border:1px solid var(--line);border-radius:6px;background:#fff}
[hidden]{display:none!important}
.tm{font-variant-numeric:tabular-nums;font-size:.95rem;opacity:.9}
.card{container-type:inline-size;min-height:0}
.card .t{flex:none;aspect-ratio:5/3;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;font-size:max(.85rem,8cqw);text-align:center;gap:4px}
.card .t img{flex:1;min-height:0;width:100%;object-fit:contain}
.hg{display:grid;gap:8px}
.hc{container-type:inline-size;border:2px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.hc small{padding:2px 8px;font-weight:700;font-size:max(.7rem,6cqw);background:rgba(19,35,58,.06)}
.hc .t{aspect-ratio:5/3;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:max(.8rem,9cqw);font-weight:700;word-break:break-all;gap:4px}
.hc .t img{flex:1;min-height:0;width:100%;max-width:none;object-fit:contain;border:0;margin:0;border-radius:0}
.hc.ok{background:var(--red);border-color:var(--red);color:#fff}.hc.ng{background:var(--blue);border-color:var(--blue);color:#fff}
.hc.ok small,.hc.ng small{background:rgba(255,255,255,.2)}
.hc.ok img,.hc.ng img{filter:invert(1) brightness(3);mix-blend-mode:screen;background:transparent}
.tl,.tr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tl button,.tr button{min-height:40px;padding:.2em .7em;font-size:.9rem;flex:none}
.tl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#dz{display:flex;flex-direction:column}#cv{order:-1}#ab2{display:none}
.ans.low #dz{display:none}
footer.bar button{padding:.5em .2em;font-size:.9rem}
@media(min-width:900px){
#dz{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
#cv{order:0;max-height:44dvh}
.tl,.tr{flex-direction:column;flex-wrap:nowrap;margin:0}
#ab2{display:block}
.ans:not(.low) #dz:not([hidden])~.row #ab{display:none}
}
.tbar{text-align:center;font-size:clamp(2.2rem,9vw,3.6rem);font-weight:700;line-height:1.15;padding:2px 8px;background:#fff;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.rvw{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.rvw .hc{width:clamp(140px,calc((100% - (var(--n) - 1)*10px)/var(--n)),360px)}
.info h3{text-align:left}
.card .h{cursor:pointer;user-select:none}.card.sel{box-shadow:0 0 0 4px var(--ink)}.card.sel .h{background:var(--ink);color:#fff}
.card .b{flex-wrap:wrap}.card .b button{flex:1 1 34px}
.card .b .mini{flex:0 0 auto;font-size:.75rem;font-weight:400;min-height:36px;padding:0 .6em}
.card .b .mini.on{background:var(--ink);color:#fff;border-color:var(--ink)}
footer.bar{flex-wrap:wrap}footer.bar button{flex:1 1 auto}
dialog{max-height:90dvh;overflow:auto}
.tl button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:46px;padding:.2em .4em}
.sz{display:block;width:20px;border-radius:99px;background:currentColor}
@media(min-width:900px){.tl{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto)}}
/* --- スクロール修正: 画面全体でスクロールし、バーは固定表示 --- */
#app{height:auto;min-height:100dvh}
header.top{position:sticky;top:0;z-index:20}
.tbar{position:sticky;top:var(--hh,56px);z-index:15}
.grid{flex:1 0 auto;overflow:visible}
footer.bar{position:sticky;bottom:0;z-index:20;box-shadow:0 -2px 8px rgba(19,35,58,.12)}
footer.bar button[data-a=reset]{color:var(--red)}
.pmain,.left{min-height:auto}
.info{flex:1 0 auto;overflow:visible}
.ans{position:sticky;bottom:0;z-index:10;max-height:62dvh;overflow:auto;box-shadow:0 -2px 8px rgba(19,35,58,.1)}
input[type=text]{font-size:16px}
/* --- 手書きボードUI --- */
.grp{display:flex;align-items:center;gap:6px}.gl{display:none;font-size:.8rem;color:var(--mut)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;min-height:44px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:.2em .5em}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.seg button small{font-size:.68rem;line-height:1}
.tl,.tr{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0;justify-content:center;align-items:center}
#cv{box-shadow:0 1px 4px rgba(19,35,58,.18);border-radius:10px}
.ans .row{margin-top:10px}
@media(min-width:900px){
.gl{display:block}.grp{flex-direction:column;align-items:stretch}
.tl{display:flex;flex-direction:column;gap:16px;margin:0;justify-content:flex-start;align-items:stretch}
.tr{flex-direction:column;align-items:stretch;margin:0;gap:14px;justify-content:flex-start}
.seg{flex-direction:column}.seg button+button{border-left:0;border-top:1px solid var(--line)}
.seg button{flex-direction:row;gap:8px;min-width:96px}
#ab2{min-height:52px;font-size:1.05rem}
#cv{max-height:48dvh}
}
/* --- 司会者カード --- */
.card{box-shadow:0 1px 3px rgba(19,35,58,.15)}
.card .h{font-size:.8rem;gap:4px}.card .h span{white-space:nowrap}
.card .h span:first-child{background:var(--ink);color:#fff;border-radius:6px;padding:0 .5em;font-weight:700}
.card.sel .h span:first-child{background:#fff;color:var(--ink)}
.neg{color:#d92d33;font-weight:700}.card.sel .h .neg{color:#ff9b9b}
#ib{display:flex;flex-direction:column;gap:8px}
.lv canvas{display:block;width:100%;aspect-ratio:5/3;background:#fff}
#fpw{padding:8px 12px;background:#dde5ed}#fpw h3{margin:0 0 6px;font-size:.85rem;color:var(--mut)}
.fl{flex-wrap:wrap;gap:6px}.fk{display:flex;gap:6px;align-items:center;min-height:36px;padding:2px 10px;background:#eef1f4;border-radius:8px}
.card.tgt{outline:3px dashed var(--ink);outline-offset:3px}
.card{scroll-margin-top:calc(var(--hh,56px) + 80px);scroll-margin-bottom:110px}
.fb{font-size:.8rem;background:#fff;color:var(--ink);border-radius:99px;padding:0 10px;font-weight:700}.fb.err{background:var(--red);color:#fff}
.pnl{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:#dde5ed}
dialog input[type=text]{flex:1;min-width:0}
/* --- 判定色の設定 --- */
html{--okbg:#e5484d;--oktx:#fff;--okf:invert(1) brightness(3);--okm:screen;--ngbg:#2f6fed;--ngtx:#fff;--ngf:invert(1) brightness(3);--ngm:screen}
html[data-okc=yellow]{--okbg:#ffd93d;--oktx:#13233a;--okf:none;--okm:multiply}
html[data-okc=blue]{--okbg:#2f6fed}
html[data-ngc=black]{--ngbg:#111;--ngtx:#fff}
html[data-ngc=red]{--ngbg:#e5484d}
.hc.ok,.card.ok{background:var(--okbg);border-color:var(--okbg);color:var(--oktx)}
.hc.ng,.card.ng{background:var(--ngbg);border-color:var(--ngbg);color:var(--ngtx)}
.hc.ok img,.card.ok .t img{filter:var(--okf);mix-blend-mode:var(--okm);background:transparent}
.hc.ng img,.card.ng .t img{filter:var(--ngf);mix-blend-mode:var(--ngm);background:transparent}
.card.ok .b .o{background:var(--okbg);color:var(--oktx);border-color:var(--okbg)}
.card.ng .b .x{background:var(--ngbg);color:var(--ngtx);border-color:var(--ngbg)}
.hc.ok .neg,.hc.ng .neg{color:inherit;text-decoration:underline}
/* --- 非公開表示・席パネル・設定 --- */
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:repeating-linear-gradient(45deg,#e1e7ee,#e1e7ee 8px,#eef2f6 8px,#eef2f6 16px);color:var(--mut);border-radius:4px;font-weight:400;font-size:.85rem}
.card .ph{cursor:pointer}.pend[data-peek]{cursor:pointer;text-decoration:underline}
.seatw{padding:8px 12px;background:#e3e9ef}.seatw h3{margin:0 0 6px;font-size:.85rem;color:var(--mut)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.seat{cursor:grab}.seat small{display:flex;justify-content:space-between;align-items:center;gap:4px}
.seat small button{min-height:24px;padding:0 6px;font-size:.7rem}
dialog details{border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0 12px}
dialog summary{cursor:pointer;font-weight:700;padding:10px 0}
dialog .f>label{flex:1}dialog .f select{max-width:60%}
.card .b button{color:var(--ink)}
.card.ok .b .o{color:var(--oktx)}.card.ng .b .x{color:var(--ngtx)}
.card .b .mini.on{color:#fff}
.seat small button{color:var(--ink)}
html[data-tgt="0"] .card.tgt{outline:none}
.card.dim,.card.dim.ok,.card.dim.ng,.hc.seat.dim,.hc.seat.dim.ok,.hc.seat.dim.ng{background:#e6eaee;border-color:#d5dbe2;color:#8995a5}
.card.dim .t img,.hc.seat.dim .t img{filter:grayscale(1);mix-blend-mode:normal;opacity:.55;background:#fff}
.card.dim .h,.hc.seat.dim small{background:rgba(19,35,58,.04)}
#ey{min-height:36px;padding:.2em .5em;display:flex;align-items:center}
header.top .code{min-width:5ch}
dialog button[id=me]{min-height:36px;padding:.2em .6em;display:flex;align-items:center}
/* --- 長押しの範囲選択を防止 --- */
body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.ans,.ans *,header.top,header.top *,.tbar,footer.bar,footer.bar *,.card .h,.card .b,.card .b *{-webkit-user-select:none;user-select:none}
.ans input[type=text]{-webkit-user-select:text;user-select:text}
#cv{-webkit-touch-callout:none;touch-action:none}
/* --- カード内ボタン: 幅に応じて2×2 / 1行 --- */
.card .b{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 8px}
.card .b button{flex:none;width:100%;min-width:0;padding-left:0;padding-right:0}
@container (min-width:250px){.card .b{grid-template-columns:1fr 1fr auto auto}.card .b .mini{width:auto;padding:0 .8em}}
.card.ok .b .o{border:2px solid var(--oktx)}.card.ng .b .x{border:2px solid var(--ngtx)}
.kb{display:none;font-size:.7rem;opacity:.75;margin-left:2px}
.pri .kb{color:#cdd6e2;opacity:1}
dialog input[type=file]{max-width:100%;min-width:0;flex:1}
dialog .f{flex-wrap:wrap}
@media(min-width:900px){
.kb{display:inline}
#mn{width:min(1040px,94vw)}
#mn .dc{columns:2;column-gap:20px}
#mn details{break-inside:avoid}
}
/* --- メニューは固定サイズ・左右の列は独立 --- */
#mn[open]{display:flex;flex-direction:column;height:min(88dvh,820px);overflow:hidden}
#mn h2{flex:none}
#mn .dc{flex:1;min-height:0;overflow:auto;padding-right:4px}
#mn>.f:last-child{flex:none;margin-bottom:0}
@media(min-width:900px){#mn .dc{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start;columns:auto}}
/* --- パネルサイズ +/- --- */
.sw{grid-template-columns:repeat(auto-fill,minmax(var(--sw,150px),1fr))}
.zm{display:inline-flex;gap:6px}.zm button{min-height:28px;min-width:34px;padding:0 8px;font-size:1rem;line-height:1}
.seatw h3,#ib h3{display:flex;align-items:center;justify-content:space-between;gap:8px}
#pnl .chip{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.mk{border-radius:99px;padding:0 8px;font-weight:700;font-size:.85rem}
.mk.ok{background:var(--okbg);color:var(--oktx)}.mk.ng{background:var(--ngbg);color:var(--ngtx)}
</style></head><body><div id="app"></div>
<script type="module">
import('./app.js').catch(e=>{document.getElementById('app').innerHTML='<div style="margin:40px auto;max-width:480px;padding:16px;font-family:sans-serif"><h1>読み込みエラー</h1><p>app.js を読み込めませんでした。index.html と同じフォルダにあるか確認してください。</p><pre style="white-space:pre-wrap;color:#c00">'+String(e&&e.message||e).replace(/</g,'&lt;')+'</pre></div>'});
</script></body></html>
